# XcodeGen spec for the native Lumber app. The .xcodeproj (and App/Info.plist)
# are generated on CI and never committed:
#
#   xcodegen generate --spec native/project.yml
#
# Everything under App/Sources is compiled into the app (App, UI, State, Theme,
# Platform); App/Resources holds the asset catalog. LumberCore is the local
# Swift package next to this file.

name: LumberNative

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # CI overrides with the run number (CFBundleVersion), so SideStore sees
    # each build as newer. 0 = a local/dev build.
    CURRENT_PROJECT_VERSION: "0"
    # Short commit shown in the Library footer; CI passes LUMBER_COMMIT=<sha7>.
    LUMBER_COMMIT: ""
    SWIFT_VERSION: "6.0"

packages:
  LumberCore:
    path: LumberCore
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2

targets:
  LumberNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: LumberCore
        product: LumberCore
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        # The bundle/executable is "LumberNative"; the home-screen name is
        # "Lumber (native)" (CFBundleDisplayName) — spaces and parentheses in
        # PRODUCT_NAME trip up scripts and paths.
        PRODUCT_NAME: LumberNative
        PRODUCT_MODULE_NAME: LumberNative
        PRODUCT_BUNDLE_IDENTIFIER: com.amardhillon.lumber.native
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        # Swift 6 language mode = complete strict concurrency checking.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Built unsigned on CI and signed at install time by SideStore.
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lumber (native)
        CFBundleName: Lumber (native)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: Lumber records your drums while the song plays.
        NSCameraUsageDescription: Lumber films you drumming while you record a take.
        NSPhotoLibraryAddUsageDescription: Lumber saves your drum videos to Photos when you tap Save to Photos.
        # Spotify login redirect: lumbernative://spotify-callback
        CFBundleURLTypes:
          - CFBundleURLName: com.amardhillon.lumber.native.spotify
            CFBundleURLSchemes:
              - lumbernative
        # Read by BuildInfo.swift for the Library build label.
        LumberCommit: $(LUMBER_COMMIT)
        LumberConfiguration: $(CONFIGURATION)

schemes:
  LumberNative:
    build:
      targets:
        LumberNative: all
    run:
      config: Debug
    archive:
      config: Release
