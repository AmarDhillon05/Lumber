# Builds an unsigned Lumber.ipa on a GitHub macOS runner, for sideloading
# from Windows (see docs/build-without-mac.md).
#
# Cost note: on private repos, macOS runner minutes are billed at 10x the
# Linux rate (a ~25 min build uses ~250 of the included minutes). Public repos
# are free. The cheap checks run on Linux first so a type error never spends
# macOS minutes.

name: iOS build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug = dev-client build that loads JS from `npx expo start --dev-client`; release = standalone app with the JS bundled in'
        type: choice
        options: [debug, release]
        default: debug
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.variant || 'release' }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ios:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # publish the .ipa and the SideStore source as release assets
    env:
      # Push builds are release builds; manual runs pick a variant.
      CONFIGURATION: ${{ (inputs.variant || 'release') == 'debug' && 'Debug' || 'Release' }}
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7

      # Expo SDK 58 needs Xcode 26.4+.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Shown in the Library ("v1.0.0 #42" and a footer with commit + variant)
      # so a phone's build can be matched to its CI run.
      - name: Stamp build info
        run: |
          printf '{ "build": "%s", "commit": "%s", "variant": "%s" }\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA:0:7}" "$CONFIGURATION" > src/buildInfo.json
          cat src/buildInfo.json
          # CFBundleVersion = run number, so SideStore sees each build as newer.
          node -e "const f='app.json',j=require('./'+f);j.expo.ios.buildNumber=process.env.GITHUB_RUN_NUMBER;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Expo prebuild (iOS)
        run: npx expo prebuild -p ios --clean --no-install

      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}

      - name: pod install
        working-directory: ios
        run: pod install

      - name: xcodebuild (iphoneos, unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME ($CONFIGURATION)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E '^(\*\*|error:|.*error:)' xcodebuild.log || true
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::xcodebuild failed ($STATUS) — see the xcodebuild-log artifact"
            exit "$STATUS"
          fi
          # The .app folder can exist after a failed link; require the binary.
          test -f "build/Build/Products/${CONFIGURATION}-iphoneos/${SCHEME}.app/${SCHEME}"

      - name: Package Lumber-unsigned.ipa
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -n1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/Lumber.app
          zip -qry Lumber-unsigned.ipa Payload
          ls -lh Lumber-unsigned.ipa
          # A real build is tens of MB; anything tiny means an empty bundle.
          test "$(stat -f%z Lumber-unsigned.ipa)" -gt 5000000

      - uses: actions/upload-artifact@v7
        with:
          name: Lumber-unsigned-${{ env.CONFIGURATION }}-${{ github.run_number }}
          path: Lumber-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      # Phone-only installs: the .ipa goes on a release (a plain download link,
      # no GitHub login or zip), and the SideStore source at
      # releases/download/sidestore/apps.json lists the newest builds so they
      # show up as updates in SideStore. Only the 5 newest build releases stay.
      - name: Publish to SideStore source
        if: env.CONFIGURATION == 'Release' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-$GITHUB_RUN_NUMBER"
          IPA="Lumber-$GITHUB_RUN_NUMBER.ipa"
          cp Lumber-unsigned.ipa "$IPA"
          gh release create "$TAG" "$IPA" --prerelease --target "$GITHUB_SHA" \
            --title "Lumber build $GITHUB_RUN_NUMBER" \
            --notes "$(git log -1 --format=%s). Unsigned; install with SideStore, Sideloadly or Impactor."
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$IPA"
          gh release view sidestore >/dev/null 2>&1 || gh release create sidestore --prerelease \
            --title "SideStore source" \
            --notes "In SideStore, add this source: https://github.com/$GITHUB_REPOSITORY/releases/download/sidestore/apps.json"
          gh release download sidestore --pattern apps.json --output previous.json 2>/dev/null || true
          node scripts/ci/sidestore-source.mjs previous.json apps.json "$GITHUB_RUN_NUMBER" "$URL" \
            "$(stat -f%z "$IPA")" "$(git log -1 --format=%s)"
          gh release upload sidestore apps.json --clobber
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
          echo "Installed builds: $URL"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
