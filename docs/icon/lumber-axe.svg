  <path d="M 230 300 l 52 -22 l 18 40 l -50 18 z" fill="#c4b5fd"/>
  <path d="M 770 760 l 44 10 l -12 42 l -42 -12 z" fill="#a78bfa"/>
  <path d="M 820 300 l 30 26 l -30 28 l -24 -26 z" fill="#8b5cf6"/>
  <defs><clipPath id="headClip"><path d="M -58 -312 L 34 -312 C 110 -312 170 -338 262 -392 Q 352 -205 262 -18 C 172 -64 110 -92 34 -104 L -58 -104 Q -74 -208 -58 -312 Z"/></clipPath></defs>
  <g transform="translate(440 520) rotate(35)">
    <!-- handle: two flat tones split down the middle -->
    <rect x="-30" y="-340" width="60" height="720" rx="30" fill="#a78bfa"/>
    <path d="M 0 -340 h 0 a 30 30 0 0 1 30 30 v 660 a 30 30 0 0 1 -30 30 z" fill="#8b5cf6"/>
