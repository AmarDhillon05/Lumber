    <path d="M -58 -312 L 34 -312 C 110 -312 170 -338 262 -392 Q 352 -205 262 -18 C 172 -64 110 -92 34 -104 L -58 -104 Q -74 -208 -58 -312 Z" fill="#7c3aed"/>
    <path d="M -80 -420 L 400 -420 L 400 -210 L -80 -210 Z" fill="#8b5cf6" clip-path="url(#headClip)"/>
    <path d="M 262 -392 Q 352 -205 262 -18 L 236 -36 Q 316 -205 236 -370 Z" fill="#ede9fe" clip-path="url(#headClip)"/>
    <ellipse cx="-6" cy="-208" rx="15" ry="21" fill="#2e1065"/>
  </g>
</svg>
